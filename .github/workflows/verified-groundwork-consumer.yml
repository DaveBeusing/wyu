name: WYU verified Groundwork consumer

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-groundwork-consumer:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      GROUNDWORK_RUN_ID: '44647126892'
      GROUNDWORK_RUN_ATTEMPT: '1'
      GROUNDWORK_EXPECTED_BRANCH: 'tasks/issue-88-swapchain-slot-wake'
      GROUNDWORK_EXPECTED_EVENT: 'workflow_dispatch'
      GROUNDWORK_EXPECTED_WORKFLOW_PATH: '.github/workflows/windows-ci.yml'
      GROUNDWORK_EXPECTED_HEAD_SHA: 'b40c11b14e64bff9b446d6eab18e8755916f66ec'
      GROUNDWORK_EXPECTED_MANIFEST_SHA256: 'E635E34F10C83E280E82BD2BB2B01D39CBC2BB3C1D507B1CA8E5DC0380050E29'
      GROUNDWORK_EXPECTED_ARTIFACT_ZIP_SHA256: '17AC237897954D8CEFCB32BB3AB06E591793EA5B91BA3C149EFF3010CFBD50FD'
      GROUNDWORK_EXPECTED_VERSION: '0.1.0-dev.44647126892.1'
      GROUNDWORK_RELEASE_TAG: 'archive-groundwork-0.1.0-dev.44647126892.1-immutable-complete'
      GROUNDWORK_ARCHIVE_RECORD_SHA256: '68C1153EE9708C1F885F6CD44A91175E863E56133C7AE8AFAAF96D032DEC60FB'
      GROUNDWORK_LICENSE_SHA256: 'A99DA262F66CB0D3881991D9F79D690DB18F83F84D22FDE5E56EE43EEA9151BF'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout WYU only
        uses: actions/checkout@v4

      - name: Set up Windows .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate Groundwork CI run identity
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/DaveBeusing/Groundwork/actions/runs/$env:GROUNDWORK_RUN_ID/attempts/$env:GROUNDWORK_RUN_ATTEMPT" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $run) { throw 'Groundwork run unavailable.' }
          if ([string]$run.id -ne $env:GROUNDWORK_RUN_ID -or [string]$run.run_attempt -ne $env:GROUNDWORK_RUN_ATTEMPT) { throw 'Run attempt mismatch.' }
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Producer CI did not pass.' }
          if ($run.head_sha -ine $env:GROUNDWORK_EXPECTED_HEAD_SHA -or $run.head_branch -cne $env:GROUNDWORK_EXPECTED_BRANCH -or
              $run.repository.full_name -cne 'DaveBeusing/Groundwork' -or $run.head_repository.full_name -cne 'DaveBeusing/Groundwork') { throw 'Producer head is not approved.' }
          if ($run.name -cne 'Groundwork Windows CI' -or $run.event -cne $env:GROUNDWORK_EXPECTED_EVENT -or
              $run.path -cne $env:GROUNDWORK_EXPECTED_WORKFLOW_PATH) { throw 'Unapproved producing workflow.' }
          Write-Host 'PASS: independently pinned Groundwork CI run identity.'

      - name: Verify durable Groundwork release metadata
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/DaveBeusing/Groundwork/releases/tags/$env:GROUNDWORK_RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $release) { throw 'Pinned Groundwork release archive is unavailable.' }
          if ($release.draft -or (-not $release.prerelease) -or $release.tag_name -cne $env:GROUNDWORK_RELEASE_TAG) { throw 'Unexpected release identity.' }
          if ([string]$release.target_commitish -ine $env:GROUNDWORK_EXPECTED_HEAD_SHA) { throw 'Unexpected archived commit.' }
          $assets = @($release.assets)
          $names = @('manifest.json','archive-record.json','LICENSE')
          $modules = @('Core','Diagnostics','Ecs','Jobs','Persistence','Platform.Windows','Rendering','Rendering.D3D12','Simulation','Voxels')
          $names += @($modules | ForEach-Object { "Groundwork.$_.$env:GROUNDWORK_EXPECTED_VERSION.nupkg" })
          if ($assets.Count -ne $names.Count) { throw 'Unexpected archived asset count.' }
          foreach ($name in $names) {
            if (@($assets | Where-Object { $_.name -ceq $name -and $_.state -eq 'uploaded' }).Count -ne 1) { throw "Missing or duplicate release asset: $name" }
          }
          foreach ($pair in @(
            @{name='manifest.json';hash=$env:GROUNDWORK_EXPECTED_MANIFEST_SHA256},
            @{name='archive-record.json';hash=$env:GROUNDWORK_ARCHIVE_RECORD_SHA256},
            @{name='LICENSE';hash=$env:GROUNDWORK_LICENSE_SHA256}
          )) {
            $asset = @($assets | Where-Object { $_.name -ceq $pair.name })[0]
            if ([string]$asset.digest -ine "sha256:$($pair.hash)") { throw "Unapproved release asset digest: $($pair.name)" }
          }
          if (-not $release.immutable) { throw 'Pinned release must be immutable.' }
          $ref = gh api "repos/DaveBeusing/Groundwork/git/ref/tags/$env:GROUNDWORK_RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $ref.object.type -cne 'commit' -or
              $ref.object.sha -ine $env:GROUNDWORK_EXPECTED_HEAD_SHA) { throw 'Archive tag does not resolve to the pinned commit.' }
          Write-Host 'PASS: durable release identity and independently pinned archive metadata.'

      - name: Download durable Groundwork release archive
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'groundwork-release-archive'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          & gh release download $env:GROUNDWORK_RELEASE_TAG --repo DaveBeusing/Groundwork --dir $artifactDir
          if ($LASTEXITCODE -ne 0) { throw 'Groundwork release archive cannot be downloaded.' }
          "GROUNDWORK_ARTIFACT_DIR=$artifactDir" >> $env:GITHUB_ENV

      - name: Verify packages, build from locked restore and exercise host lifecycle and save recovery
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:GROUNDWORK_ARTIFACT_DIR 'manifest.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Missing producer manifest.' }
          $sha256 = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          if ($sha256 -ine $env:GROUNDWORK_EXPECTED_MANIFEST_SHA256) { throw 'Untrusted manifest digest.' }
          foreach ($pair in @(
            @{name='archive-record.json';hash=$env:GROUNDWORK_ARCHIVE_RECORD_SHA256},
            @{name='LICENSE';hash=$env:GROUNDWORK_LICENSE_SHA256}
          )) {
            $path = Join-Path $env:GROUNDWORK_ARTIFACT_DIR $pair.name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing archive record or license: $($pair.name)" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $pair.hash) { throw "Modified release archive asset: $($pair.name)" }
          }
          $archive = Get-Content (Join-Path $env:GROUNDWORK_ARTIFACT_DIR 'archive-record.json') -Raw | ConvertFrom-Json
          if ($archive.schemaVersion -ne 1 -or $archive.sourceRepository -cne 'DaveBeusing/Groundwork' -or
              [string]$archive.producerRunId -ne $env:GROUNDWORK_RUN_ID -or
              [string]$archive.producerRunAttempt -ne $env:GROUNDWORK_RUN_ATTEMPT -or
              $archive.producerHeadSha -ine $env:GROUNDWORK_EXPECTED_HEAD_SHA -or
              $archive.producerHeadBranch -cne $env:GROUNDWORK_EXPECTED_BRANCH -or
              $archive.producerEvent -cne $env:GROUNDWORK_EXPECTED_EVENT -or
              $archive.producerWorkflowPath -cne $env:GROUNDWORK_EXPECTED_WORKFLOW_PATH -or
              $archive.packagedCommitSha -ine $env:GROUNDWORK_EXPECTED_HEAD_SHA -or
              $archive.packageVersion -cne $env:GROUNDWORK_EXPECTED_VERSION -or
              $archive.manifestSha256 -ine $env:GROUNDWORK_EXPECTED_MANIFEST_SHA256 -or
              $archive.artifactZipSha256 -ine $env:GROUNDWORK_EXPECTED_ARTIFACT_ZIP_SHA256) {
            throw 'Archive provenance record does not match pinned producer.'
          }
          & ./eng/Test-VerifiedGroundworkConsumer.ps1 -ArtifactDirectory $env:GROUNDWORK_ARTIFACT_DIR -ExpectedManifestSha256 $env:GROUNDWORK_EXPECTED_MANIFEST_SHA256 -ExpectedSourceCommit $env:GROUNDWORK_EXPECTED_HEAD_SHA -ExpectedVersion $env:GROUNDWORK_EXPECTED_VERSION -SaveSmoke -PrototypeSaveSmoke
          if ($LASTEXITCODE -ne 0) { throw 'Verified consumer gate failed.' }
